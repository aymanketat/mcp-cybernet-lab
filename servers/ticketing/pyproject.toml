[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcl-ticketing"
version = "0.1.0"
description = "Helpdesk: tickets written by customers, replies sent back to them (MCP CyberNet Lab)"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]

[project.scripts]
mcl-ticketing = "ticketing.server:main"

[tool.setuptools]
packages = ["ticketing"]
