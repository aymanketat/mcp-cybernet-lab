[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcl-crm"
version = "0.1.0"
description = "Customer records and contracts in Arabic and English, read-only (MCP CyberNet Lab)"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]

[project.scripts]
mcl-crm = "crm.server:main"

[tool.setuptools]
packages = ["crm"]
