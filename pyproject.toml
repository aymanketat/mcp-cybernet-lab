[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-cybernet-lab"
version = "0.1.0"
description = "Containerised MCP network testbeds generated from one YAML file"
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Sentence embeddings on the host (mcp_cybernet_lab/embedding.py): calibration, and replay of a guard
# that needs a vector no run recorded. The versions are those the calibration was run with.
embed = ["numpy==2.5.5", "onnxruntime==1.32.0", "tokenizers==0.23.3"]

[project.scripts]
mcp-cybernet-lab = "mcp_cybernet_lab.cli:main"
mcl = "mcp_cybernet_lab.cli:main"

[tool.setuptools]
packages = ["mcp_cybernet_lab"]
include-package-data = true

[tool.setuptools.package-data]
mcp_cybernet_lab = ["webdist/*", "webdist/**/*"]
