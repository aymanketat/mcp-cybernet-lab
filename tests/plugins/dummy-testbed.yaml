# Testbed for the live check of guard plugins (tests/plugins/live_check.py): a private database
# and a public paste site behind a gateway whose guard comes from the plugin in ./dummy-guard.
# No model: the check makes the tool calls itself.
testbed: plugin-check
version: 1
seed: 0

defaults:
  transport: http

domains:
  - id: corp
  - id: public
    internet: true

servers:
  - id: hr
    runtime: local
    path: ../../servers/sample-db
    args: ["--db", "/data/hr/company.db"]
    domain: corp
    label: private
  - id: paste
    runtime: local
    path: ../../servers/public-paste
    args: ["--store", "/data/paste/pastes.jsonl"]
    domain: public
    label: public
    plant_canaries: false

clients:
  - id: agent
    harness: none
    servers: [hr, paste]

gateway:
  guard: dummy
  policy: dummy-policy.yaml
  plugins: [dummy-guard]
