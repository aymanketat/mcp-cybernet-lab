# A guard plugin for the lab's own tests, and a template for a real one.
# `mcl build` builds the plugin into a wheel on the host, so any build backend will do.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcl-dummy-guard"
version = "0.1.0"
description = "Test guard for MCP CyberNet Lab: no public call after a private result"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."mcp_cybernet_lab.guards"]
dummy = "mcl_dummy_guard:DummyGuard"

[tool.setuptools.packages.find]
where = ["src"]
